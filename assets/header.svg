<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="1" stop-color="#0A1022"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#0052FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#7FA6FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B2A4A" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="440" fill="url(#fade)"/></mask>
    <clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      .line{opacity:0;animation:show .01s forwards}
      .l1{animation-delay:1.2s}.l2{animation-delay:1.9s}.l3{animation-delay:2.5s}.l4{animation-delay:3.1s}.l5{animation-delay:3.7s}.l6{animation-delay:4.3s}
      @keyframes show{to{opacity:1}}
      .caret{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-16}}
      .b1{animation-delay:0s}.b2{animation-delay:.6s}.b3{animation-delay:1.2s}.b4{animation-delay:1.8s}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect width="1200" height="440" fill="url(#glow)"/>

    <!-- left: identity -->
    <g class="sans">
      <g class="rise d1">
        <rect x="64" y="72" width="196" height="30" rx="15" fill="#0052FF" fill-opacity="0.14" stroke="#0052FF" stroke-opacity="0.6"/>
        <circle cx="84" cy="87" r="5" fill="#3B82FF" class="pulse"/>
        <text x="98" y="92" class="mono" font-size="13" fill="#9DB8FF" letter-spacing="1">BUILDING ON BASE</text>
      </g>
      <text x="62" y="178" font-size="76" font-weight="800" fill="url(#txt)" letter-spacing="-2" class="rise d2">memosr.eth</text>
      <text x="64" y="222" font-size="24" font-weight="500" fill="#C9D4EC" class="rise d3">Blockchain Developer &amp; Node Operator</text>
      <text x="64" y="256" font-size="17" fill="#7C8BA8" class="rise d3">Smart contracts, on-chain data and developer tooling on Base.</text>

      <g class="rise d4 mono" font-size="13">
        <rect x="64" y="292" width="98" height="30" rx="8" fill="#0F1830" stroke="#22345E"/>
        <text x="113" y="312" text-anchor="middle" fill="#C9D4EC">Solidity</text>
        <rect x="172" y="292" width="98" height="30" rx="8" fill="#0F1830" stroke="#22345E"/>
        <text x="221" y="312" text-anchor="middle" fill="#C9D4EC">Foundry</text>
        <rect x="280" y="292" width="98" height="30" rx="8" fill="#0F1830" stroke="#22345E"/>
        <text x="329" y="312" text-anchor="middle" fill="#C9D4EC">TypeScript</text>
        <rect x="388" y="292" width="70" height="30" rx="8" fill="#0F1830" stroke="#22345E"/>
        <text x="423" y="312" text-anchor="middle" fill="#C9D4EC">x402</text>
        <rect x="468" y="292" width="70" height="30" rx="8" fill="#0F1830" stroke="#22345E"/>
        <text x="503" y="312" text-anchor="middle" fill="#C9D4EC">MCP</text>
      </g>

      <!-- block chain strip -->
      <g transform="translate(64 360)">
        <line x1="34" y1="17" x2="460" y2="17" stroke="#0052FF" stroke-width="2" class="flow"/>
        <g class="mono" font-size="11">
          <rect x="0" y="0" width="68" height="34" rx="7" fill="#0A1430" stroke="#0052FF" class="pulse b1"/>
          <text x="34" y="21" text-anchor="middle" fill="#9DB8FF">#0x01</text>
          <rect x="130" y="0" width="68" height="34" rx="7" fill="#0A1430" stroke="#0052FF" class="pulse b2"/>
          <text x="164" y="21" text-anchor="middle" fill="#9DB8FF">#0x02</text>
          <rect x="260" y="0" width="68" height="34" rx="7" fill="#0A1430" stroke="#0052FF" class="pulse b3"/>
          <text x="294" y="21" text-anchor="middle" fill="#9DB8FF">#0x03</text>
          <rect x="390" y="0" width="68" height="34" rx="7" fill="#0052FF" class="pulse b4"/>
          <text x="424" y="21" text-anchor="middle" fill="#FFFFFF">#next</text>
        </g>
      </g>
    </g>

    <!-- right: terminal -->
    <g transform="translate(660 70)" class="rise d3">
      <rect width="476" height="300" rx="14" fill="#070B16" fill-opacity="0.92" stroke="#22345E"/>
      <rect width="476" height="38" rx="14" fill="#0E1528"/>
      <rect y="24" width="476" height="14" fill="#0E1528"/>
      <circle cx="22" cy="19" r="6" fill="#FF5F57"/>
      <circle cx="42" cy="19" r="6" fill="#FEBC2E"/>
      <circle cx="62" cy="19" r="6" fill="#28C840"/>
      <text x="238" y="24" text-anchor="middle" class="mono" font-size="12" fill="#5E6E8F">memosr@base: ~/contracts</text>

      <g class="mono" font-size="14">
        <text x="22" y="76" class="line l1"><tspan fill="#3B82FF">$</tspan><tspan fill="#E6ECF8"> whoami</tspan></text>
        <text x="22" y="100" class="line l2" fill="#7C8BA8">computer engineer · istanbul · memosr.eth</text>
        <text x="22" y="136" class="line l3"><tspan fill="#3B82FF">$</tspan><tspan fill="#E6ECF8"> forge script Deploy --rpc-url base</tspan></text>
        <text x="22" y="160" class="line l4" fill="#28C840">✓ Compiled 12 files with solc 0.8.x</text>
        <text x="22" y="184" class="line l5" fill="#28C840">✓ Deployed to Base mainnet</text>
        <text x="22" y="208" class="line l5" fill="#7C8BA8">  chain 8453 · gas 0.004 gwei</text>
        <text x="22" y="244" class="line l6"><tspan fill="#3B82FF">$</tspan><tspan fill="#E6ECF8"> ship --next</tspan></text>
        <rect x="132" y="232" width="9" height="16" fill="#3B82FF" class="line l6 caret"/>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="24" fill="none" stroke="#1B2A4A"/>
</svg>
